# DigitalOcean App Platform — spec voor de VitePress-documentatiesite.
# Toepassen:  doctl apps update <APP_ID> --spec .do/app.yaml
# Pas repo/branch/source_dir aan aan je situatie.

name: docleas-documentation
region: ams
static_sites:
  - name: docs
    github:
      repo: doclr-be/docleas-documentatie
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run docs:build
    output_dir: .vitepress/dist
    # GEEN catchall_document: dat zou 404.html met status 200 serveren (SPA-gedrag)
    # en is slecht voor indexering. Alle interne links zijn expliciete .html-bestanden.
    error_document: 404.html
    environment_slug: node-js
