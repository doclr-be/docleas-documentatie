site_name: Docleas Documentatie
site_description: Documentatie voor het Docleas afsprakensysteem
site_author: Docleas Team

theme:
  name: material
  language: nl
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: nl

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Voor burgers:
    - Burgerhandleiding: burgerhandleiding.md
  - Voor dienstbeheerders:
    - Overzicht: dienstbeheerders/index.md
    - Gemeente-instellingen: dienstbeheerders/gemeente-instellingen.md
    - Producten:
      - Algemene werking: dienstbeheerders/producten/algemene-werking.md
      - Producten beheren: dienstbeheerders/producten/producten-beheren.md
      - Algemene instellingen: dienstbeheerders/producten/algemene-instellingen.md
      - Teksten: dienstbeheerders/producten/teksten.md
      - Velden: dienstbeheerders/producten/velden.md
      - Beschikbaarheden: dienstbeheerders/producten/beschikbaarheden.md
      - Groepen: dienstbeheerders/producten/groepen.md
      - Structuur: dienstbeheerders/producten/structuur.md
      - Overzichtspagina: dienstbeheerders/producten/overzichtspagina.md
    - Agenda's: dienstbeheerders/agendas.md
    - Werkschema: dienstbeheerders/werkschema.md
    - Gebruikers: dienstbeheerders/gebruikers.md
    - Statistieken: dienstbeheerders/statistieken.md
    - FAQ: dienstbeheerders/faq.md
  - Technisch:
    - Technische documentatie: technische-documentatie.md

docs_dir: Documentation

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/docleas
